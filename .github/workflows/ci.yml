name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Python smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q

      - name: Release audit
        run: uv run python scripts/audit_release.py

      - name: Demo smoke test
        run: uv run autocus demo --output outputs/ci-demo --device cpu
