task: plaque_classification
model:
  name: plaque_senet
  spatial_dims: 2
  in_channels: 1
  out_channels: 2
  pretrained: false
  dropout_prob: 0.2
  use_msf: true
  use_cbam: true
  use_dsv: true
  aux_loss_weight: 0.3
train:
  max_epochs: 80
  batch_size: 32
optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 0.0001
data:
  manifest: examples/example_manifest.json
output:
  root_dir: outputs/plaquesenet
