pipeline:
  roi: focusnet
  iqe_stages: [aar, norm, sr]
  artery_segmentation: larsnet_v5
  plaque_segmentation: plaque_net_v1
  plaque_classification: plaque_senet
  plaque_threshold: 0.62
normalization:
  method: iqe_norm_traditional
  background_threshold: 0.0196078431372549
  use_foreground_mask: true
  mask_feather: 8
  pclip_low: 0.5
  pclip_high: 99.5
  denoise_method: srad
  srad_iter: 30
  srad_dt: 0.05
  srad_window: 3
  clahe_clip: 1.5
  clahe_tile_grid: 8
  clahe_dynamic_grid: false
weights:
  focusnet: weights/autocus_focusnet_roi_v1.pth
  aarformer: weights/autocus_aarformer_v1.pth
  cuhat: weights/autocus_cuhat_v1.pth
  larsnet_long: weights/autocus_larsnet_long_v1.pth
  larsnet_trans: weights/autocus_larsnet_trans_v1.pth
  plaquenet: weights/autocus_plaquenet_v1.pth
  plaquesenet: weights/autocus_plaquesenet_ensemble_v1.json
output:
  root_dir: outputs/demo
