task: artery_segmentation_transverse
model:
  name: larsnet_v5
  spatial_dims: 2
  in_channels: 1
  out_channels: 2
  pretrained: false
larsnet:
  w_sdt: 0.3
  w_skel: 0.0
  use_ema: false
train:
  max_epochs: 100
  batch_size: 8
optimizer:
  type: adamw
  lr: 0.0003
  weight_decay: 0.00001
data:
  manifest: examples/toy_manifest.json
output:
  root_dir: outputs/larsnet_trans
