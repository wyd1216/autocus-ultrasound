[project]
name = "autocus-ultrasound"
version = "0.1.0"
description = "Public research framework for quality-gated carotid-ultrasound plaque profiling."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "AutoCUS Contributors"}]
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "monai>=1.4",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "tqdm>=4",
  "scikit-image>=0.22",
  "scipy>=1.11",
]

[project.optional-dependencies]
interpretability = ["grad-cam>=1.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wyd1216/autocus-ultrasound"
Repository = "https://github.com/wyd1216/autocus-ultrasound"
Issues = "https://github.com/wyd1216/autocus-ultrasound/issues"

[project.scripts]
autocus = "autocus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
